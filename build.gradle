plugins {
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'java'
}

group = 'eu.xenit.contentgrid'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}
        
repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	implementation 'org.springframework.boot:spring-boot-starter-integration'
	implementation 'org.springframework:spring-webflux'
	implementation 'io.projectreactor.netty:reactor-netty'
	implementation 'org.springframework.integration:spring-integration-amqp'
		
	implementation 'com.nimbusds:nimbus-jose-jwt:9.47'	
	runtimeOnly 'org.bouncycastle:bcpkix-jdk15on:1.70'
	
	implementation 'io.micrometer:micrometer-core'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.integration:spring-integration-test'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner:4.1.5'

	implementation 'com.fasterxml.jackson.core:jackson-databind'

}

tasks.named('test') {
	useJUnitPlatform()
}

springBoot {
	buildInfo ()
}

bootRun {
    args = ["--spring.profiles.active=bootRun"]
}

bootBuildImage {
    def dockerImageRepo = "ghcr.io/xenit-eu/contentgrid-slingshot"
    imageName = "${dockerImageRepo}:${project.version}"
    tags = "${project.version}".endsWith('SNAPSHOT') ? [ "${dockerImageRepo}:SNAPSHOT" ] : null

    docker {
        publishRegistry {
            url = project.findProperty('DOCKER_PUBLISH_REGISTRY_URL')
            username = project.findProperty('DOCKER_PUBLISH_REGISTRY_USERNAME')
            password = project.findProperty('DOCKER_PUBLISH_REGISTRY_PASSWORD')
        }
    }
}
